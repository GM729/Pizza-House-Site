<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizza House</title>
<style>
:root{--red:#c8102e;--black:#1a1412;--cream:#fff9ee;--gold:#f2b632;--ink:#2b2320;--card:#fff;--line:#eadfc9}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Noto Nastaliq Urdu",serif;background:var(--cream);color:var(--ink);font-size:17px;line-height:1.5}
body[dir=rtl]{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",Tahoma,serif;line-height:2}
button,select,input{font:inherit}
header{background:var(--black);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:4px solid var(--gold)}
header h1{margin:0;font-size:1.5rem;color:var(--gold);letter-spacing:.5px}
.lang{background:var(--gold);color:var(--black);border:0;border-radius:8px;padding:10px 14px;min-height:44px;font-weight:700;cursor:pointer}
.hero{background:var(--red);color:#fff;padding:26px 16px}
.hero p{margin:0;font-size:1.35rem;max-width:30ch}
.hero small{display:block;margin-top:8px;opacity:.9}
.tools{position:sticky;top:0;z-index:5;background:var(--cream);padding:10px 12px;border-bottom:1px solid var(--line)}
.tools input{width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;min-height:46px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}
.cat{flex:none;border:2px solid var(--black);background:#fff;border-radius:999px;padding:8px 16px;min-height:44px;cursor:pointer;white-space:nowrap}
.cat[aria-pressed=true]{background:var(--black);color:var(--gold)}
main{padding:12px;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{background:linear-gradient(135deg,#ffe3a1,#f2b632);font-size:3.2rem;text-align:center;padding:16px 0}
.body{padding:12px;display:flex;flex-direction:column;gap:10px;flex:1}
.body h3{margin:0;font-size:1.1rem}
.tag{font-size:.8rem;border:1px solid #2e7d32;color:#2e7d32;border-radius:6px;padding:0 6px;margin-inline-start:6px}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.sz{flex:1;min-width:64px;min-height:44px;border:2px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;font-size:.85rem}
.sz[aria-pressed=true]{border-color:var(--red);background:#fff0f0;font-weight:700}
.body select{min-height:44px;border:2px solid var(--line);border-radius:10px;padding:0 8px;background:#fff}
.price{margin-top:auto;font-size:1.4rem;font-weight:700;color:var(--red)}
.off{opacity:.55}.off .price{color:#777}
.empty{grid-column:1/-1;text-align:center;padding:30px}
footer{text-align:center;padding:20px;font-size:.85rem;color:#7a6c60}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:active{transform:scale(.99)}}

[hidden]{display:none!important}
body{padding-bottom:84px}body.lock{overflow:hidden}
.hbtns{display:flex;gap:8px;align-items:center}
.lang.alt{background:#fff}
.add,.send{background:var(--red);color:#fff;border:0;border-radius:10px;min-height:48px;padding:0 16px;font-weight:700;cursor:pointer}
.add:disabled{background:#999;cursor:not-allowed}
.clear{background:#fff;border:2px solid var(--black);border-radius:10px;min-height:46px;padding:0 14px;cursor:pointer;margin-top:8px;width:100%}
#cartBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:8;background:var(--gold);color:var(--black);border:3px solid var(--black);border-radius:999px;min-height:52px;padding:0 22px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;max-width:94vw}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;justify-content:center;align-items:flex-end}
.sheet{background:var(--cream);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.head h2{margin:0}.x{background:var(--black);color:#fff;border:0;border-radius:50%;width:44px;height:44px;cursor:pointer}
.line,.arow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.info{flex:1 1 150px;display:flex;flex-direction:column}.info small{color:#6b5d52}
.qty{display:flex;align-items:center;gap:8px}.qty span{min-width:24px;text-align:center;font-weight:700}
.qb{width:44px;height:44px;border:2px solid var(--black);background:#fff;border-radius:10px;font-size:1.3rem;cursor:pointer}
.rm{background:none;border:2px solid var(--red);color:var(--red);border-radius:10px;min-height:44px;padding:0 12px;cursor:pointer}
.totals{padding:10px 0;border-bottom:1px solid var(--line)}
.trow{display:flex;justify-content:space-between;padding:2px 0}.trow.big{font-size:1.3rem;font-weight:700;color:var(--red)}
.form{display:flex;flex-direction:column;gap:10px;padding-top:10px}
.fld{display:flex;flex-direction:column;gap:4px}.fld span{font-weight:700;font-size:.9rem}
.fld input,.fld select,.fld textarea{padding:10px;border:2px solid var(--line);border-radius:10px;min-height:46px;background:#fff;font:inherit;width:100%}
.fld.chk{flex-direction:row-reverse;justify-content:flex-end;align-items:center;gap:10px}.fld.chk input{width:26px;min-height:26px}
.err{color:#b00020;font-weight:700;margin:0}.okmsg{background:#e8f5e9;border-radius:10px;padding:0 10px}.okmsg:empty{display:none}
.warn{background:#fff3cd;border:1px solid var(--gold);border-radius:10px;padding:8px 10px;font-size:.9rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.bar .add{flex:1 0 100%}.bar .sz{flex:1 1 45%}
.ch{margin:16px 0 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:30;background:var(--black);color:#fff;padding:10px 16px;border-radius:10px;max-width:92vw;text-align:center}


.pic.hasimg{padding:0;background:#f2e2b8}.pic img{width:100%;height:150px;object-fit:cover;display:block}
.v3row{display:flex;gap:6px}.vb{flex:1;min-height:44px;border:2px solid var(--black);background:#fff;border-radius:10px;font-size:.85rem;cursor:pointer}.vb.ar{background:var(--gold)}
.stage{height:min(52vh,420px);background:#fff3d6;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.stage model-viewer{width:100%;height:100%}.stage img{max-width:100%;max-height:100%;object-fit:contain}.fbig{font-size:5rem}
.vstatus{margin:8px 0;font-weight:700}.vnote{color:#8a4b00;background:#fff3cd;border-radius:10px;padding:0 10px;margin:8px 0}.vnote:empty{display:none}
.vhelp{font-size:.88rem;color:#5b4d42;margin:6px 0}.prevI{max-width:160px;max-height:120px;border-radius:8px;margin:6px 0;display:block}
</style>
</head>
<body>
<header><h1 id="rname"></h1><div class="hbtns"><button class="lang alt" id="manageBtn" type="button">⚙ Manage</button><button class="lang" id="langBtn" type="button"></button></div></header>
<section class="hero"><p id="tagline"></p><small id="note"></small></section>
<div class="tools"><input id="q" type="search" autocomplete="off"><div class="cats" id="cats"></div></div>
<main id="menu"></main>
<footer>&copy; Pizza House</footer>
<button id="cartBtn" type="button"></button>
<div class="overlay" id="cartView" hidden></div>
<div class="overlay" id="adminView" hidden></div>
<div class="overlay" id="viewView" hidden></div>
<div id="toast" role="status" hidden></div>
<noscript><p style="padding:20px">Please turn on JavaScript to see the menu.</p></noscript>
<script>

    { id: "premium", en: "Special & Premium", ur: "خصوصی پیزا", icon: "👑", pizza: true, items: [

<script>
(function () {
  "use strict";
  var KEY = "pizzaHouse_menu_v1", CKEY = "pizzaHouse_cart_v1";
  var DEFAULT = JSON.parse(JSON.stringify(window.MENU_DATA));
  var T = {
    en: { search: "Search the menu...", all: "All", none: "No items found. Try another word.", unavailable: "Currently unavailable", size: "Size", crust: "Crust", veg: "Veg", tagline: "Fresh, hot and made your way.", note: "Sample prices — owner can edit.", lang: "اردو",
      add: "Add to cart", added: "added to cart", cart: "Cart", cartEmpty: "Your cart is empty. Add something tasty!", remove: "Remove", subtotal: "Subtotal", delivery: "Delivery charge", total: "Total",
      name: "Your name", phone: "Phone number", type: "Order type", dine: "Dine-in", take: "Takeaway", deliv: "Delivery", address: "Delivery address", pay: "Payment method", notes: "Notes (optional)", send: "Order on WhatsApp", clear: "Clear cart", close: "Close", v3d: "View in 3D", vAR: "View in AR" },
    ur: { search: "مینو تلاش کریں...", all: "سب", none: "کوئی آئٹم نہیں ملا۔", unavailable: "فی الحال دستیاب نہیں", size: "سائز", crust: "کرسٹ", veg: "سبزی", tagline: "تازہ، گرم اور آپ کی پسند کے مطابق۔", note: "نمونہ قیمتیں — مالک تبدیل کر سکتا ہے۔", lang: "English",
      add: "کارٹ میں شامل کریں", added: "کارٹ میں شامل ہو گیا", cart: "کارٹ", cartEmpty: "آپ کا کارٹ خالی ہے۔", remove: "ہٹائیں", subtotal: "ذیلی کل", delivery: "ڈیلیوری چارجز", total: "کل رقم",
      name: "آپ کا نام", phone: "فون نمبر", type: "آرڈر کی قسم", dine: "ڈائن اِن", take: "ٹیک اوے", deliv: "ڈیلیوری", address: "ڈیلیوری کا پتہ", pay: "ادائیگی کا طریقہ", notes: "نوٹ (اختیاری)", send: "واٹس ایپ پر آرڈر کریں", clear: "کارٹ خالی کریں", close: "بند کریں", v3d: "تھری ڈی میں دیکھیں", vAR: "اے آر میں دیکھیں" }
  };

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function btn(cls, text, fn) { var b = el("button", cls, text); b.type = "button"; if (fn) b.onclick = fn; return b; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function uid() { return "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  var tt; function toast(m) { var x = $("toast"); x.textContent = m; x.hidden = false; clearTimeout(tt); tt = setTimeout(function () { x.hidden = true; }, 2400); }

  /* ---------- storage ---------- */
  function prep(m) {
    var r = m.restaurant = m.restaurant || {};
    if (r.delivery == null) r.delivery = 150;
    if (!r.payments) r.payments = "Cash on Delivery, Cash at Counter";
    m.categories.forEach(function (c) { c.items.forEach(function (i) { if (!i.id) i.id = uid(); }); });
    return m;
  }
  function loadMenu() {
    try {
      var s = localStorage.getItem(KEY);
      if (s) { var o = JSON.parse(s); if (o && Array.isArray(o.categories) && Array.isArray(o.sizes) && o.sizes.length && Array.isArray(o.crusts) && o.crusts.length) return prep(o); }
    } catch (e) {}
    return prep(clone(DEFAULT));
  }
  function loadCart() {
    try { var c = JSON.parse(localStorage.getItem(CKEY)); if (Array.isArray(c)) return c.filter(function (l) { return l && l.name && l.qty > 0 && typeof l.unit === "number"; }); } catch (e) {}
    return [];
  }
  function saveMenu() { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { toast("Could not save: browser storage is full or blocked (private mode?)."); } }
  function saveCart() { try { localStorage.setItem(CKEY, JSON.stringify(state.cart)); } catch (e) {} }

  var D = loadMenu();
  var state = { lang: "en", cat: "all", q: "", pick: {}, cart: loadCart(), form: { name: "", phone: "", type: "delivery", address: "", pay: "", notes: "" } };

  /* ---------- helpers ---------- */
  function money(n) { return D.currency + " " + Number(n).toLocaleString("en-PK"); }
  function sizePrice(item, id) { var t = item.prices || D.tiers[item.tier]; return t ? t[id] : undefined; }
  function crustExtra(id) { var c = D.crusts.filter(function (x) { return x.id === id; })[0]; return c ? Number(c.extra) : 0; }
  function crustName(id) { var c = D.crusts.filter(function (x) { return x.id === id; })[0]; return c ? c.name : id; }
  function sizeName(id) { var c = D.sizes.filter(function (x) { return x.id === id; })[0]; return c ? c.name : id; }
  function findCat(id) { return D.categories.filter(function (c) { return c.id === id; })[0]; }
  function subtotal() { return state.cart.reduce(function (a, l) { return a + l.unit * l.qty; }, 0); }
  function count() { return state.cart.reduce(function (a, l) { return a + l.qty; }, 0); }
  function waNumber(raw) {
    var d = String(raw || "").replace(/\D/g, "");
    if (d.indexOf("00") === 0) d = d.slice(2);
    if (d.charAt(0) === "0") d = "92" + d.slice(1);
    return /^\d{11,15}$/.test(d) ? d : "";
  }
  function updateCartBtn() { $("cartBtn").textContent = "🛒 " + T[state.lang].cart + " (" + count() + ") · " + money(subtotal()); }
  function lock(on) { document.body.classList.toggle("lock", on); }
  function closeView(v) { v.hidden = true; v.textContent = ""; lock(false); }
  function head(title, v) { var h = el("div", "head"); h.appendChild(el("h2", "", title)); var c = btn("x", "✕", function () { closeView(v); }); c.setAttribute("aria-label", "Close"); h.appendChild(c); return h; }
  function fld(label, input) { var l = el("label", "fld"); l.appendChild(el("span", "", label)); l.appendChild(input); return l; }
  function inp(type, val) { var i = el("input"); i.type = type; i.value = val == null ? "" : val; if (type === "number") { i.min = "0"; i.step = "1"; i.setAttribute("inputmode", "numeric"); } return i; }
  function opt(sel, value, text) { var o = el("option", "", text); o.value = value; sel.appendChild(o); }

  /* ---------- customer menu ---------- */
  function render() {
    var t = T[state.lang];
    document.documentElement.lang = state.lang;
    document.body.dir = state.lang === "ur" ? "rtl" : "ltr";
    $("rname").textContent = D.restaurant.name;
    document.title = D.restaurant.name;
    $("tagline").textContent = t.tagline; $("note").textContent = t.note;
    $("langBtn").textContent = t.lang; $("q").placeholder = t.search;
    var cats = $("cats"); cats.textContent = "";
    [{ id: "all", en: t.all, ur: t.all }].concat(D.categories).forEach(function (c) {
      var b = btn("cat", c[state.lang] || c.en, function () { state.cat = c.id; render(); });
      b.setAttribute("aria-pressed", String(state.cat === c.id)); cats.appendChild(b);
    });
    var main = $("menu"); main.textContent = ""; var n = 0;
    D.categories.forEach(function (cat) {
      if (state.cat !== "all" && state.cat !== cat.id) return;
      cat.items.forEach(function (item) {
        if (item.n.toLowerCase().indexOf(state.q) === -1) return;
        n++; main.appendChild(card(cat, item));
      });
    });
    if (!n) main.appendChild(el("p", "empty", t.none));
    updateCartBtn();
  }

  function card(cat, item) {
    var t = T[state.lang], sized = !!(item.tier || item.prices);
    var pick = state.pick[item.id] = state.pick[item.id] || { size: (D.sizes[1] || D.sizes[0]).id, crust: D.crusts[0].id };
    if (sized && sizePrice(item, pick.size) == null) {
      var ok = D.sizes.filter(function (s) { return sizePrice(item, s.id) != null; })[0]; if (ok) pick.size = ok.id;
    }
    var c = el("article", "card" + (item.available === false ? " off" : ""));
    var pic = el("div", "pic"); pic.setAttribute("aria-hidden", "true");
    if (item.img) {
      pic.className = "pic hasimg"; var im = el("img"); im.alt = ""; im.loading = "lazy";
      im.onerror = function () { pic.className = "pic"; pic.textContent = cat.icon || "🍕"; };
      im.src = item.img; pic.appendChild(im);
    } else pic.textContent = cat.icon || "🍕";
    c.appendChild(pic);
    var b = el("div", "body"), h = el("h3", "", item.n);
    if (item.veg) h.appendChild(el("span", "tag", t.veg));
    b.appendChild(h);
    var price = el("div", "price");
    function update() {
      var p = sized ? sizePrice(item, pick.size) : item.price;
      price.textContent = p == null ? "—" : money(Number(p) + (cat.pizza ? crustExtra(pick.crust) : 0));
    }
    if (sized) {
      var row = el("div", "sizes"); row.setAttribute("role", "group"); row.setAttribute("aria-label", t.size);
      D.sizes.forEach(function (s) {
        if (sizePrice(item, s.id) == null) return;
        var sb = btn("sz", s.name); sb.setAttribute("aria-pressed", String(pick.size === s.id));
        sb.onclick = function () {
          pick.size = s.id; update();
          Array.prototype.forEach.call(row.children, function (x) { x.setAttribute("aria-pressed", "false"); });
          sb.setAttribute("aria-pressed", "true");
        };
        row.appendChild(sb);
      });
      b.appendChild(row);
    }
    if (cat.pizza) {

  function validModel(u) {
    if (/^https:\/\/\S+$/i.test(u)) { try { return /\.(glb|gltf)$/i.test(new URL(u).pathname); } catch (e) { return false; } }
    return /^[\w\-.\/]+\.(glb|gltf)$/i.test(u) && u.charAt(0) !== "/" && u.indexOf("..") < 0;
  }
  function validImage(u) {
    if (/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(u)) return true;
    if (/^https:\/\/\S+$/i.test(u)) { try { return /\.(jpe?g|png|webp|gif|avif)$/i.test(new URL(u).pathname); } catch (e) { return false; } }
    return /^[\w\-.\/]+\.(jpe?g|png|webp|gif|avif)$/i.test(u) && u.charAt(0) !== "/" && u.indexOf("..") < 0;
  }
  function shrink(file, cb) {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return cb(null, "Please choose a JPG, PNG or WebP photo.");
    if (file.size > 12 * 1024 * 1024) return cb(null, "That photo is too big (over 12 MB).");
    var r = new FileReader();
    r.onerror = function () { cb(null, "Could not read that file."); };
    r.onload = function () {
      var im = new Image();
      im.onerror = function () { cb(null, "Could not open that image."); };
      im.onload = function () {
        var k = Math.min(1, 640 / Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); cb(c.toDataURL("image/jpeg", 0.72));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  }
  function builtinModel() {
    if (!builtinURL) { var s = atob(BUILTIN_GLB), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); builtinURL = URL.createObjectURL(new Blob([u], { type: "model/gltf-binary" })); }
    return builtinURL;
  }
  function modelInfo(item) {
    var u = (item.model || "").trim() || (D.restaurant.defaultModel || "").trim();
    return u && validModel(u) ? { url: u, builtin: false } : { url: builtinModel(), builtin: true };
  }
  function loadMV() {
    if (window.customElements && customElements.get("model-viewer")) return Promise.resolve();
    if (!mvP) {
      mvP = new Promise(function (res, rej) {
        var s = document.createElement("script"), to = setTimeout(function () { rej(new Error("timeout")); }, 20000);
        s.type = "module"; s.src = MV_URL;
        s.onload = function () { customElements.whenDefined("model-viewer").then(function () { clearTimeout(to); res(); }); };
        s.onerror = function () { clearTimeout(to); rej(new Error("failed")); };
        document.head.appendChild(s);
      });
      mvP.catch(function () { mvP = null; });
    }
    return mvP;
  }
  function openViewer(item, wantAR) {
    var v = $("viewView"), t = T[state.lang], info = modelInfo(item), mv = null;
    v.textContent = ""; v.hidden = false; lock(true);
    var s = el("div", "sheet"); v.appendChild(s); s.appendChild(head(item.n, v));
    var stage = el("div", "stage"), status = el("p", "vstatus", "Loading the 3D viewer..."), note = el("p", "vnote");
    status.setAttribute("role", "status"); note.setAttribute("role", "status");
    var arB = btn("send", "📱 " + t.vAR); arB.disabled = true;
    s.appendChild(stage); s.appendChild(status); s.appendChild(arB); s.appendChild(note);
    s.appendChild(el("p", "vhelp", info.builtin
      ? "This is the built-in demo pizza, about 30 cm (12 inches) wide. It is the same for every pizza and is not scaled by size."
      : "In AR, the real-world size depends on how your model file was made."));
    s.appendChild(el("p", "vhelp", "AR only works on supported phones, on a website opened with https, with a hosted .glb model. If it is not available you can still rotate and zoom the 3D pizza."));
    stage.appendChild(el("div", "fbig", "🍕"));

    function fallback(msg) {
      stage.textContent = "";
      if (item.img) { var im = el("img"); im.alt = item.n; im.onerror = function () { im.remove(); stage.appendChild(el("div", "fbig", "🍕")); }; im.src = item.img; stage.appendChild(im); }
      else stage.appendChild(el("div", "fbig", "🍕"));
      status.textContent = msg; arB.disabled = true; note.textContent = "AR is not available because the 3D model is not showing.";
    }
    function arReason() {
      if (info.builtin) return "AR needs your own pizza .glb file hosted online with https. This demo model can only be viewed in 3D. (See the setup instructions to host a model, then paste its link in ⚙ Manage.)";
      if (!window.isSecureContext) return "AR only works when the page is opened from a real https:// website. A file opened from your computer or phone can show 3D but usually not AR.";
      if (!mv || !mv.canActivateAR) return "AR cannot start on this phone or browser. Android needs Chrome, Google Play Services for AR (ARCore) and a supported phone; iPhone needs Safari. You can still rotate and zoom the 3D pizza.";
      return "";
    }
    arB.onclick = function () {
      var why = arReason(); if (why) { note.textContent = why; return; }
      note.textContent = ""; try { mv.activateAR(); } catch (e) { note.textContent = "AR could not be started. Please try again or use the 3D view."; }
    };
    function build() {
      if (v.hidden) return;
      mv = document.createElement("model-viewer");
      var at = { src: info.url, alt: "3D model of " + item.n, "camera-controls": "", "auto-rotate": "", ar: "", "ar-modes": "webxr scene-viewer quick-look", "ar-scale": "fixed",
        "touch-action": "pan-y", "shadow-intensity": "0.7", "camera-orbit": "0deg 60deg auto", "interaction-prompt": "none", "environment-image": "neutral" };
      Object.keys(at).forEach(function (k) { mv.setAttribute(k, at[k]); });
      if (item.img) mv.setAttribute("poster", item.img);
      var hid = el("button"); hid.slot = "ar-button"; hid.hidden = true; mv.appendChild(hid);
      mv.addEventListener("load", function () {
        status.textContent = "Drag to rotate. Pinch or scroll to zoom."; arB.disabled = false;
        var why = arReason(); if (wantAR || why) note.textContent = why || "Ready: tap “" + t.vAR + "”.";
      });
      mv.addEventListener("error", function () { fallback("The 3D model could not be loaded. Check the model link in ⚙ Manage. Showing the picture instead."); });
      mv.addEventListener("ar-status", function (e) { if (e.detail && e.detail.status === "failed") note.textContent = "AR failed to start on this device. The 3D view still works."; });
      stage.textContent = ""; stage.appendChild(mv); status.textContent = "Loading the 3D model...";
    }
    loadMV().then(build).catch(function () { if (!v.hidden) fallback("The 3D viewer could not be loaded (no internet?). Showing the picture instead."); });
  }

  /* ---------- start ---------- */
  $("q").addEventListener("input", function (e) { state.q = e.target.value.trim().toLowerCase(); render(); $("q").focus(); });
  $("langBtn").onclick = function () { state.lang = state.lang === "en" ? "ur" : "en"; render(); };
  $("cartBtn").onclick = openCart;
  $("manageBtn").onclick = openAdmin;
  ["cartView", "adminView", "viewView"].forEach(function (id) { $(id).addEventListener("click", function (e) { if (e.target === this) closeView(this); }); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") ["cartView", "adminView", "viewView"].forEach(function (id) { if (!$(id).hidden) closeView($(id)); }); });
  render();
})();
